version: 2

updates:
  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "jcoletaylor"
    assignees:
      - "jcoletaylor"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      sqlx:
        patterns:
          - "sqlx*"
      serde:
        patterns:
          - "serde*"
      tokio:
        patterns:
          - "tokio*"
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jcoletaylor"
    assignees:
      - "jcoletaylor"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Ruby dependencies (tasker-rb gem)
  - package-ecosystem: "bundler"
    directory: "/crates/tasker-rb/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jcoletaylor"
    assignees:
      - "jcoletaylor"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      ruby-dependencies:
        update-types:
          - "minor"
          - "patch"

  # Python dependencies (tasker-py bindings + coverage tooling), tracked via uv.lock
  - package-ecosystem: "uv"
    directories:
      - "/crates/tasker-py/"
      - "/tools/cargo-make/scripts/coverage/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jcoletaylor"
    assignees:
      - "jcoletaylor"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-dependencies:
        update-types:
          - "minor"
          - "patch"

  # TypeScript dependencies (tasker-ts bindings, Bun workspace)
  - package-ecosystem: "bun"
    directory: "/crates/tasker-ts/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jcoletaylor"
    assignees:
      - "jcoletaylor"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      typescript-dependencies:
        update-types:
          - "minor"
          - "patch"

  # Docker base images (pgmq PostgreSQL images)
  - package-ecosystem: "docker"
    directory: "/docker/db/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "jcoletaylor"
    assignees:
      - "jcoletaylor"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      docker-base-images:
        update-types:
          - "minor"
          - "patch"
