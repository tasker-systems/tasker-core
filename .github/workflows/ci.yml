name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue. Each queued PR is re-tested as the exact commit that will land (main plus
  # every entry ahead of it plus this PR) on a `gh-readonly-queue/main/pr-N-<sha>` branch, and
  # the required `CI Success` check must report on THAT commit before the queue merges it.
  # Without this trigger the check never reports there, and every queued PR waits out the
  # queue's status-check timeout and is ejected.
  merge_group:
    types: [checks_requested]

# Least privilege by default: the GITHUB_TOKEN can only read the repo.
# Any job that needs more declares its own `permissions:` block.
permissions:
  contents: read

jobs:
  # ============================================================================
  # Stage 0: Detect Change Scope
  # Analyzes changed files to determine which CI jobs need to run.
  # ~30s — runs before everything else.
  # ============================================================================
  detect-scope:
    name: Detect CI Scope
    runs-on: ubuntu-22.04
    outputs:
      run-build-postgres: ${{ steps.detect.outputs.run-build-postgres }}
      run-build-workers: ${{ steps.detect.outputs.run-build-workers }}
      run-lockfile-check: ${{ steps.detect.outputs.run-lockfile-check }}
      run-build-ruby: ${{ steps.detect.outputs.run-build-ruby }}
      run-build-python: ${{ steps.detect.outputs.run-build-python }}
      run-build-typescript: ${{ steps.detect.outputs.run-build-typescript }}
      run-build-rust-worker: ${{ steps.detect.outputs.run-build-rust-worker }}
      run-code-quality: ${{ steps.detect.outputs.run-code-quality }}
      run-integration-tests: ${{ steps.detect.outputs.run-integration-tests }}
      run-ruby-framework: ${{ steps.detect.outputs.run-ruby-framework }}
      run-python-framework: ${{ steps.detect.outputs.run-python-framework }}
      run-typescript-framework: ${{ steps.detect.outputs.run-typescript-framework }}
      run-codegen-validation: ${{ steps.detect.outputs.run-codegen-validation }}
      run-performance-analysis: ${{ steps.detect.outputs.run-performance-analysis }}
      scope-summary: ${{ steps.detect.outputs.scope-summary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: detect
        env:
          # Set only on merge_group: the queue commit's base, so scope covers exactly what the
          # queue entry adds. Empty otherwise, and the script derives the base as before.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          chmod +x .github/scripts/detect-ci-scope.sh
          .github/scripts/detect-ci-scope.sh --github-output --verbose ${MERGE_GROUP_BASE_SHA:+--base "$MERGE_GROUP_BASE_SHA"}

      - name: Annotate scope
        run: |
          echo "::notice title=CI Scope::${{ steps.detect.outputs.scope-summary }}"

  # ============================================================================
  # Stage 0.5: Lockfile Consistency (fast fail)
  # Fails the pipeline when a committed lockfile would change against the
  # committed manifests (cargo, bundler, uv). Without this, cargo silently
  # mutates the lock on build and drift goes unnoticed (the lock drifted for
  # ~7 months on main before PR #339 fixed it).
  #
  # bun.lock is intentionally not re-checked here: test-typescript-framework.yml
  # already installs with `bun install --frozen-lockfile` for every change under
  # crates/tasker-ts/ (run-typescript-framework), so drift there already fails
  # an existing gate.
  # ============================================================================
  lockfile-check:
    name: Lockfile Consistency
    needs: detect-scope
    if: needs.detect-scope.outputs.run-lockfile-check == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Check Cargo.lock is consistent with workspace manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Set up Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.4"
          working-directory: crates/tasker-rb

      - name: Check Gemfile.lock is consistent with Gemfile/gemspec
        # bundler 4 dropped `bundle lock --check`; --print resolves without
        # writing, so diffing against the committed lock asserts the same thing.
        run: bundle lock --print | diff - Gemfile.lock
        working-directory: crates/tasker-rb

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Check uv.lock is consistent with pyproject.toml
        run: uv lock --check
        working-directory: crates/tasker-py

  # ============================================================================
  # Stage 0.6: The tasker-systems conventions baseline, and the gates it adopts
  # These read only the tree, so they run on every change: no `if:`, no scope.
  # ============================================================================

  # The tasker-systems conventions baseline, as this repository is pinned to it
  # (.conventions/consumer.toml; doctrine in .conventions/baseline/doctrine/consuming.md).
  #
  # `check` fails when an adopted config drifts from the pinned projection without a reasoned
  # exception, when the projection itself was hand-edited or the pin is not a commit on the
  # baseline's main, when a status names a gate that does not exist, when the projected skill or
  # the entry files' link to it is stale, and when status.toml was not reviewed at the pin. It
  # reports how far the pin trails the baseline, and never fails on that.
  #
  # `witness` is the check's bite test: it seeds one violation per case into a copy of the tree and
  # requires `check` to refuse each, naming what was seeded. Its control run happens online in an
  # environment with no credential, which is the evidence that a fork's pull request gets the
  # same verdict.
  #
  # NO `if:`: guidance and adopted config change in docs-only changes too. It reads only files and
  # the public baseline repository, so this job holds no secret and must not gain one (the witness
  # fails if it does). Needs python3 >= 3.11 and git.
  conventions:
    name: Conventions baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python (the repository pin, >= 3.11)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Python and git versions
        run: python3 --version && git --version

      - name: Check against the pinned baseline
        run: python3 -I .conventions/baseline/tools/conventions.py check

      - name: Witness — each check refuses a seeded violation
        run: python3 -I .conventions/baseline/tools/conventions.py witness

  # Every .py file in the repository, from the root ruff.toml (the baseline's canonical
  # configuration, PY-LINT-1); tasker-py's pyproject.toml extends it. The version is the one
  # crates/tasker-py/uv.lock pins, so this job and a local `uv run ruff` agree.
  python-lint:
    name: Python lint (ruff, every .py)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      RUFF_VERSION: 0.14.9
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install ruff (exact version)
        run: pipx install "ruff==${RUFF_VERSION}"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # cargo-deny over the dependency graph (deny.toml, the baseline's canonical file in superset
  # mode): crate sources (SC-DENY-1), licenses (SC-DENY-2) and bans (SC-DENY-3). Advisories are
  # cargo audit's, in code-quality.yml, so that there is one reviewed ignore list. Reads only
  # manifests and the lock; nothing compiles.
  supply-chain:
    name: Supply chain (cargo deny)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # main

      - name: Install cargo-deny (exact version)
        run: cargo binstall --no-confirm "cargo-deny@${CARGO_DENY_VERSION}"

      - name: cargo deny check sources licenses bans
        run: cargo deny --locked check sources licenses bans

  # ============================================================================
  # Stage 1: Build PostgreSQL image with PGMQ extension
  # ============================================================================
  build-postgres:
    needs: detect-scope
    if: needs.detect-scope.outputs.run-build-postgres == 'true'
    # A caller's permissions cap the called workflow's. build-postgres.yml's job
    # requests `packages: write` to push the test Postgres image to GHCR, so it
    # must be granted here or the call is rejected.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-postgres.yml

  # ============================================================================
  # Stage 2: Build Worker Extensions
  # Builds Ruby/Python FFI extensions and Rust worker binary
  # ============================================================================
  build-workers:
    needs: [detect-scope, build-postgres]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-build-workers == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-postgres.result == 'success' || needs.build-postgres.result == 'skipped')
    uses: ./.github/workflows/build-workers.yml
    with:
      postgres-image: ${{ needs.build-postgres.outputs.postgres-image }}
      build-ruby: ${{ needs.detect-scope.outputs.run-build-ruby == 'true' }}
      build-python: ${{ needs.detect-scope.outputs.run-build-python == 'true' }}
      build-typescript: ${{ needs.detect-scope.outputs.run-build-typescript == 'true' }}
      build-rust-worker: ${{ needs.detect-scope.outputs.run-build-rust-worker == 'true' }}

  # ============================================================================
  # Stage 3: Parallel Test Execution
  # All four test workflows run in parallel after build-workers completes:
  #   - integration-tests: workspace-compile → unit-tests → E2E tests
  #   - ruby-framework-tests: Ruby FFI + client API tests (rspec)
  #   - python-framework-tests: Python FFI + client API tests (pytest)
  #   - typescript-framework-tests: TypeScript framework + client API tests (bun test)
  #
  # TAS-284: Client API tests (formerly test-ffi-client.yml) are now merged
  # into each framework workflow to avoid redundant builds and leverage sccache.
  # ============================================================================
  integration-tests:
    needs: [detect-scope, build-postgres, build-workers]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-integration-tests == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-postgres.result == 'success') &&
      (needs.build-workers.result == 'success' || needs.build-workers.result == 'skipped')
    uses: ./.github/workflows/test-integration.yml
    with:
      postgres-image: ${{ needs.build-postgres.outputs.postgres-image }}
      build-ruby: ${{ needs.detect-scope.outputs.run-build-ruby == 'true' }}
      build-python: ${{ needs.detect-scope.outputs.run-build-python == 'true' }}
      build-typescript: ${{ needs.detect-scope.outputs.run-build-typescript == 'true' }}

  ruby-framework-tests:
    needs: [detect-scope, build-postgres, build-workers]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-ruby-framework == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-postgres.result == 'success') &&
      (needs.build-workers.result == 'success' || needs.build-workers.result == 'skipped')
    uses: ./.github/workflows/test-ruby-framework.yml
    with:
      postgres-image: ${{ needs.build-postgres.outputs.postgres-image }}

  python-framework-tests:
    needs: [detect-scope, build-postgres, build-workers]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-python-framework == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-postgres.result == 'success') &&
      (needs.build-workers.result == 'success' || needs.build-workers.result == 'skipped')
    uses: ./.github/workflows/test-python-framework.yml
    with:
      postgres-image: ${{ needs.build-postgres.outputs.postgres-image }}

  typescript-framework-tests:
    needs: [detect-scope, build-postgres, build-workers]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-typescript-framework == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-postgres.result == 'success') &&
      (needs.build-workers.result == 'success' || needs.build-workers.result == 'skipped')
    uses: ./.github/workflows/test-typescript-framework.yml
    with:
      postgres-image: ${{ needs.build-postgres.outputs.postgres-image }}

  validate-codegen:
    needs: [detect-scope, build-workers]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-codegen-validation == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-workers.result == 'success' || needs.build-workers.result == 'skipped')
    uses: ./.github/workflows/validate-codegen.yml

  # Code quality runs in parallel with builds after postgres is ready
  code-quality:
    needs: [detect-scope, build-postgres]
    if: >-
      always() &&
      needs.detect-scope.outputs.run-code-quality == 'true' &&
      needs.detect-scope.result == 'success' &&
      (needs.build-postgres.result == 'success' || needs.build-postgres.result == 'skipped')
    uses: ./.github/workflows/code-quality.yml
    with:
      postgres-image: ${{ needs.build-postgres.outputs.postgres-image }}

  # ============================================================================
  # Stage 4: Performance Analysis
  # Aggregates test results from all test stages
  # ============================================================================
  performance-analysis:
    needs: [detect-scope, integration-tests, ruby-framework-tests, python-framework-tests, typescript-framework-tests]
    runs-on: ubuntu-22.04
    if: >-
      always() &&
      needs.detect-scope.outputs.run-performance-analysis == 'true' &&
      needs.detect-scope.result == 'success'
    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-test-results*"
          merge-multiple: true
          path: performance-data/
        continue-on-error: true

      - name: Checkout for scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - name: Aggregate performance metrics
        run: |
          chmod +x .github/scripts/aggregate-performance-metrics.sh
          .github/scripts/aggregate-performance-metrics.sh performance-data performance-summary.md

      - name: Upload performance analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-analysis
          path: |
            performance-summary.md
            performance-data/

  # ============================================================================
  # Stage 5: CI Success Gate
  # Validates all required jobs passed based on detected scope.
  # This is the single required status check in branch protection.
  # ============================================================================
  ci-success:
    name: CI Success
    needs: [detect-scope, lockfile-check, conventions, python-lint, supply-chain, build-postgres, build-workers, code-quality, integration-tests, ruby-framework-tests, python-framework-tests, typescript-framework-tests, validate-codegen, performance-analysis]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Validate CI results against scope
        run: |
          echo "=== CI Scope: ${{ needs.detect-scope.outputs.scope-summary }} ==="
          echo ""

          # detect-scope must always succeed
          if [ "${{ needs.detect-scope.result }}" != "success" ]; then
            echo "FATAL: detect-scope failed (result=${{ needs.detect-scope.result }})"
            exit 1
          fi

          FAILED=""

          # Helper: check a job result against whether it was expected to run
          # Usage: check_job "job-name" "result" "should-run"
          check_job() {
            local name="$1"
            local result="$2"
            local should_run="$3"

            if [ "$should_run" = "true" ]; then
              if [ "$result" = "success" ]; then
                echo "  PASS: ${name} (ran and succeeded)"
              else
                echo "  FAIL: ${name} (expected success, got ${result})"
                FAILED="${FAILED} ${name}"
              fi
            else
              if [ "$result" = "skipped" ]; then
                echo "  SKIP: ${name} (not in scope, correctly skipped)"
              elif [ "$result" = "success" ]; then
                echo "  PASS: ${name} (not in scope but succeeded anyway)"
              else
                echo "  SKIP: ${name} (not in scope, result=${result})"
              fi
            fi
          }

          # Unscoped: these run on every change, so they must always succeed.
          check_job "conventions" "${{ needs.conventions.result }}" "true"
          check_job "python-lint" "${{ needs.python-lint.result }}" "true"
          check_job "supply-chain" "${{ needs.supply-chain.result }}" "true"

          check_job "build-postgres" \
            "${{ needs.build-postgres.result }}" \
            "${{ needs.detect-scope.outputs.run-build-postgres }}"

          check_job "lockfile-check" \
            "${{ needs.lockfile-check.result }}" \
            "${{ needs.detect-scope.outputs.run-lockfile-check }}"

          check_job "build-workers" \
            "${{ needs.build-workers.result }}" \
            "${{ needs.detect-scope.outputs.run-build-workers }}"

          check_job "code-quality" \
            "${{ needs.code-quality.result }}" \
            "${{ needs.detect-scope.outputs.run-code-quality }}"

          check_job "integration-tests" \
            "${{ needs.integration-tests.result }}" \
            "${{ needs.detect-scope.outputs.run-integration-tests }}"

          check_job "ruby-framework-tests" \
            "${{ needs.ruby-framework-tests.result }}" \
            "${{ needs.detect-scope.outputs.run-ruby-framework }}"

          check_job "python-framework-tests" \
            "${{ needs.python-framework-tests.result }}" \
            "${{ needs.detect-scope.outputs.run-python-framework }}"

          check_job "typescript-framework-tests" \
            "${{ needs.typescript-framework-tests.result }}" \
            "${{ needs.detect-scope.outputs.run-typescript-framework }}"

          check_job "validate-codegen" \
            "${{ needs.validate-codegen.result }}" \
            "${{ needs.detect-scope.outputs.run-codegen-validation }}"

          check_job "performance-analysis" \
            "${{ needs.performance-analysis.result }}" \
            "${{ needs.detect-scope.outputs.run-performance-analysis }}"

          echo ""
          if [ -n "$FAILED" ]; then
            echo "FAILED jobs:${FAILED}"
            exit 1
          else
            echo "All required CI checks passed!"
          fi
