name: Code Quality

on:
  workflow_call:
    inputs:
      postgres-image:
        required: true
        type: string

# Least privilege by default: the GITHUB_TOKEN can only read the repo.
# Any job that needs more declares its own `permissions:` block.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_rust_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache
        with:
          cache-prefix: quality

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: "sqlx-cli audit make"

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      # `--workspace` below compiles every member, including the FFI crates: tasker-rb's
      # extension needs Ruby's headers (rb-sys), and tasker-py's pyo3 abi3-py311 needs a
      # Python >= 3.11 interpreter. Same pins and version files as build-workers.yml.
      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          working-directory: crates/tasker-rb

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Setup database
        run: sqlx migrate run

      - name: Check formatting
        run: cargo fmt --all -- --check

      # NOTE: We use explicit features instead of --all-features because
      # tokio-console requires RUSTFLAGS="--cfg tokio_unstable" and the tokio
      # `tracing` feature, which adds complexity. tokio-console is a local dev tool.
      #
      # `--workspace` (RUST-LINT-2): the root Cargo.toml is itself a package with no
      # default-members, so without it clippy lints only the root package and the member
      # libraries it reaches through dev-dependencies, never tasker-ctl, tasker-secure,
      # tasker-runtime, the FFI crates, tasker-example-rs or any member's own tests.
      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --features "benchmarks,test-services" -- -D warnings

      - name: Security audit
        # Blocking gate. Exceptions live in .cargo/audit.toml — every ignore
        # there carries a written reason and status; add new ones only in review.
        # cargo-audit 0.22.2 parses CVSS 4.0 fine (rustsec/rustsec#1465 no longer
        # reproduces), so a clean exit is a real gate, not a tool quirk.
        # Findings are dispositioned: semver-compatible fixes are bumped in
        # Cargo.lock; the remainder are justified in .cargo/audit.toml.
        run: |
          # Clear advisory-db cache to get latest database
          rm -rf ~/.cargo/advisory-db
          cargo audit

      # `--workspace` for the same reason as clippy: without it only the root package is
      # documented.
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --features "benchmarks,test-services"
