name: TypeScript Framework & Client Tests

on:
  workflow_call:
    inputs:
      postgres-image:
        description: "PostgreSQL with PGMQ image tag"
        required: true
        type: string

# Least privilege by default: the GITHUB_TOKEN can only read the repo.
# Any job that needs more declares its own `permissions:` block.
permissions:
  contents: read

jobs:
  typescript-framework:
    name: TypeScript Framework & Client Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    # PostgreSQL service for FFI bootstrap tests
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_DB: tasker_rust_test
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasker -d tasker_rust_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # TAS-156: Redis for distributed template cache
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: crates/tasker-ts

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space

      # ========================================================================
      # Setup runtimes for napi-rs FFI testing
      # ========================================================================
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Rust (for cargo-make + orchestration server)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: "sqlx-cli make"

      - name: Run database migrations
        run: cargo sqlx migrate run
        working-directory: .
        env:
          DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker_rust_test

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ========================================================================
      # Download FFI library artifact from build-typescript job
      # ========================================================================
      - name: Download TypeScript artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript-artifacts
          path: artifacts/
        continue-on-error: true

      - name: Restore FFI module
        run: |
          cd ../../..
          if [ -d artifacts ]; then
            ARTIFACTS_DIR=artifacts tools/cargo-make/scripts/ci-restore-typescript-artifacts.sh
          else
            echo "No artifacts directory found, FFI tests may skip"
          fi
          # napi CLI places .node files in package root — FfiLayer auto-discovers them
          ls -la crates/tasker-ts/tasker_ts.*.node 2>/dev/null || echo "No FFI module available"

      # ========================================================================
      # Quality Checks and Unit Tests (no FFI required)
      # ========================================================================
      - name: Run quality checks (lint + typecheck)
        run: |
          cargo make lint
          cargo make typecheck

      - name: Run TypeScript unit tests
        run: cargo make test-ci
        env:
          TASKER_ENV: test

      # ========================================================================
      # napi-rs FFI Integration Tests
      # ========================================================================
      - name: Run napi-rs FFI integration tests
        run: cargo make test-ffi
        env:
          TASKER_ENV: test
          DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker_rust_test
          REDIS_URL: redis://localhost:6379
          FFI_BOOTSTRAP_TESTS: "true"
        continue-on-error: true

      # ========================================================================
      # Client API Integration Tests (TAS-284: merged from test-ffi-client.yml)
      # ========================================================================
      - name: Download core artifacts (for orchestration server)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-artifacts
          path: artifacts/core
        continue-on-error: true

      - name: Start orchestration server
        working-directory: .
        run: tools/cargo-make/scripts/ci-start-orchestration-server.sh
        env:
          DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker_rust_test
          REDIS_URL: redis://localhost:6379
          TASKER_ENV: test
          TASKER_TEMPLATE_PATH: ${{ github.workspace }}/tests/fixtures/task_templates
          SQLX_OFFLINE: "true"

      - name: Run TypeScript client API tests
        run: cargo make test-client-ci
        env:
          TASKER_ENV: test
          DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker_rust_test
          REDIS_URL: redis://localhost:6379
          FFI_CLIENT_TESTS: "true"
          FFI_BOOTSTRAP_TESTS: "true"
          TASKER_ORCHESTRATION_URL: http://localhost:8080
          TASKER_CONFIG_PATH: ${{ github.workspace }}/config/tasker/generated/worker-test.toml
          TASKER_WEB_BIND_ADDRESS: "0.0.0.0:8182"
          TASKER_WORKER_GRPC_BIND_ADDRESS: "0.0.0.0:9182"
          TASKER_TEMPLATE_PATH: ${{ github.workspace }}/tests/fixtures/task_templates

      - name: Stop orchestration server
        if: always()
        working-directory: .
        run: tools/cargo-make/scripts/ci-stop-orchestration-server.sh

      # ========================================================================
      # Build and Summary
      # ========================================================================
      - name: Run build
        run: bun run build

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: typescript-framework-test-results
          path: |
            target/typescript-unit-results.txt
            target/typescript-client-results.txt
          if-no-files-found: warn

      - name: Display test summary
        if: always()
        working-directory: .
        run: tools/cargo-make/scripts/ci-display-test-summary.sh typescript
