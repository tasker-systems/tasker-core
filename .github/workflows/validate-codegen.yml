name: Validate Codegen

on:
  workflow_call:

# Least privilege by default: the GITHUB_TOKEN can only read the repo.
# Any job that needs more declares its own `permissions:` block.
permissions:
  contents: read

jobs:
  validate-codegen:
    name: Validate Generated Code Syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download core artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-artifacts
          path: target/debug/

      - name: Make binaries executable
        run: chmod +x target/debug/tasker-ctl

      - name: Install Rust toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          # Reads the pinned version from crates/tasker-rb/.ruby-version
          working-directory: crates/tasker-rb

      - name: Set up Bun (for tsc)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install TypeScript compiler
        run: bun install -g typescript

      - name: Validate codegen output
        run: |
          chmod +x tools/cargo-make/scripts/validate-codegen.sh
          tools/cargo-make/scripts/validate-codegen.sh \
            --binary target/debug/tasker-ctl \
            --fixture tests/fixtures/task_templates/codegen_test_template.yaml \
            --verbose
