name: Build Workers

on:
  workflow_call:
    inputs:
      postgres-image:
        required: true
        type: string
      build-ruby:
        required: false
        type: boolean
        default: true
      build-python:
        required: false
        type: boolean
        default: true
      build-typescript:
        required: false
        type: boolean
        default: true
      build-rust-worker:
        required: false
        type: boolean
        default: true

# Least privilege by default: the GITHUB_TOKEN can only read the repo.
# Any job that needs more declares its own `permissions:` block.
permissions:
  contents: read

# =============================================================================
# Multi-Job Build Strategy
# =============================================================================
# Each job runs on a fresh runner with clean disk space (~14GB available).
# This prevents "no space left on device" errors that occur when building
# all workers in a single job.
#
# Stage 1: build-core - Build Rust core packages, upload artifacts
# Stage 2: build-{ruby,python,typescript,rust} - Build each worker in parallel
#
# Artifacts flow:
#   build-core → uploads core-artifacts (binaries + cargo cache info)
#   build-* → downloads core cache, builds worker, uploads worker-specific artifacts
# =============================================================================

jobs:
  # ============================================================================
  # Stage 1: Build Core Packages
  # ============================================================================
  build-core:
    name: Build Core Packages
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_rust_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: "sqlx-cli make"

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      - name: Setup database
        run: sqlx migrate run
        env:
          DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker_rust_test

      # NOTE: We use explicit features instead of --all-features because
      # tokio-console requires RUSTFLAGS="--cfg tokio_unstable" which we don't
      # set in CI. tokio-console is a local development tool.
      - name: Build core packages
        run: |
          echo "🔨 Building core packages..."
          cargo build \
            --features "test-services" \
            --package tasker-shared \
            --package tasker-orchestration \
            --package tasker-worker \
            --package tasker-pgmq \
            --package tasker-client \
            --package tasker-ctl \
            --bins
          echo "📦 Verifying binaries were created..."
          ls -lh target/debug/tasker-server target/debug/tasker-worker target/debug/tasker-ctl
        env:
          DATABASE_URL: postgresql://tasker:tasker@localhost:5432/tasker_rust_test

      - name: Upload core build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-artifacts
          path: |
            target/debug/tasker-server
            target/debug/tasker-worker
            target/debug/tasker-ctl
          retention-days: 1
          if-no-files-found: error

  # ============================================================================
  # Stage 2: Build Workers (in parallel)
  # ============================================================================

  build-ruby:
    name: Build Ruby FFI Extension
    if: inputs.build-ruby
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build-core

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_rust_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Setup Ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          bundler-cache: true
          working-directory: crates/tasker-rb

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      - name: Build Ruby FFI extension
        run: |
          echo "🔨 Building Ruby FFI extension..."
          cd crates/tasker-rb
          bundle install
          bundle exec rake compile
        env:
          SQLX_OFFLINE: "true"

      - name: Upload Ruby extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-extension
          path: |
            crates/tasker-rb/lib/tasker_core/tasker_rb.bundle
            crates/tasker-rb/lib/tasker_core/tasker_rb.so
          retention-days: 1
          if-no-files-found: warn

  build-python:
    name: Build Python FFI Extension
    if: inputs.build-python
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build-core

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_rust_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      - name: Build Python FFI extension
        run: |
          echo "🔨 Building Python FFI extension..."
          cd crates/tasker-py
          uv sync --dev
          uv run maturin develop
        env:
          SQLX_OFFLINE: "true"

      # Python extension is installed in-place via maturin develop
      # No artifact upload needed - framework tests will build it fresh

  build-typescript:
    name: Build TypeScript Worker
    if: inputs.build-typescript
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build-core

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_rust_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: "make"

      - name: Build TypeScript worker
        run: |
          echo "🔨 Building TypeScript worker..."
          cd crates/tasker-ts
          cargo make build
        env:
          SQLX_OFFLINE: "true"

      - name: Upload TypeScript artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript-artifacts
          path: |
            crates/tasker-ts/dist/
            crates/tasker-ts/tasker_ts.*.node
          retention-days: 1
          if-no-files-found: warn

  build-rust-worker:
    name: Build Rust Worker
    if: inputs.build-rust-worker
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: build-core

    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: tasker
          POSTGRES_PASSWORD: tasker
          POSTGRES_DB: tasker_rust_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup mold linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Setup Rust build cache
        uses: ./.github/actions/setup-rust-cache

      - name: Setup shared environment variables
        uses: ./.github/actions/setup-env

      - name: Install protobuf compiler
        uses: ./.github/actions/install-protobuf

      - name: Build Rust worker
        run: |
          echo "🔨 Building Rust worker..."
          cargo build --package tasker-example-rs
        env:
          SQLX_OFFLINE: "true"

      - name: Upload Rust worker artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-worker-artifact
          path: target/debug/rust-worker
          retention-days: 1
          if-no-files-found: warn
