# This repository's status for each baseline rule, in the register's vocabulary:
# gated: <path>[#job], partial: …, practiced, convention: …, uncovered, unexamined, n/a.
#
# Read from tasker-core's own gates and tree (.github/workflows, .github/actions, the configs),
# never from the register: the register's tasker-core column is generated from this file. `gated`
# names the job whose step fails on a violation; the comment above each line is the evidence. Jobs
# in a reusable workflow are named in that file (code-quality.yml, test-*.yml), all of which fan
# into `CI Success` in ci.yml. Path-scoped jobs (detect-scope) still count: CI Success fails one
# that is in scope and did not succeed. conventions, python-lint and supply-chain are unscoped.
#
# Clippy and rustdoc reach: code-quality runs `cargo clippy --workspace --all-targets` and
# `cargo doc --workspace`, so every member and every test target is linted. (Before the lint
# table's adoption neither had --workspace; the root Cargo.toml is itself a package with no
# default-members, so they reached only the root package and the libraries it pulled in.)
#
# Adoption is in steps (audit-before-enforce): deny.toml, .cargo/audit.toml, .clippy.toml and
# ruff.toml first (tasker-core#380), then the Rust workspace lint table. The TypeScript configs are
# the next step; their rules read as below until they land.
#
# `reviewed_at` is the baseline revision these statuses were reviewed against (check F).
reviewed_at = "99967726e20b1cb2a94cf6ca7d115472b97d63ff"
[rules]
# --- Rust ---
# Cargo.toml [workspace.lints] adopted in table mode (one reasoned exception: the tokio_unstable check-cfg); every member sets [lints] workspace = true, checked by hand.
RUST-LINT-1 = "partial: the table is the projection's (ci.yml#conventions, check A) and all 16 members inherit it; nothing refuses a new member without [lints] workspace = true"
# code-quality.yml: cargo clippy --workspace --all-targets -D warnings and RUSTDOCFLAGS=-D warnings cargo doc --workspace; the release pre-flight clippy has no --workspace.
RUST-LINT-2 = "gated: .github/workflows/code-quality.yml#quality"
# allow_attributes and allow_attributes_without_reason, denied workspace-wide. Inner #![allow(dead_code, reason)] remains only in tests/common and tests/mcp helpers (the doctrine's exception); tonic's generated code sits under one reasoned #![expect].
RUST-LINT-3 = "gated: .github/workflows/code-quality.yml#quality"
# Process rule. The lint table's adoption measured 129 findings (94 sites) first.
RUST-LINT-4 = "convention: an adoption process judged in review; the table was adopted with every finding fixed or reason-annotated and the dead crate-level #![allow]s removed"
# The canonical table sets no group off, so clippy's default groups stay on and are denied under -D warnings.
RUST-LINT-5 = "uncovered: style/complexity/perf still run at clippy's defaults (the canonical table does not turn them off); its named single lints are on"
